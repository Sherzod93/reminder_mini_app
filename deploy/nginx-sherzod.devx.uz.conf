# /etc/nginx/sites-available/sherzod.devx.uz.conf
server {
    listen 80;
    server_name sherzod.devx.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sherzod.devx.uz;

    ssl_certificate     /etc/letsencrypt/live/sherzod.devx.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherzod.devx.uz/privkey.pem;

    root /var/www/reminder/public;
    index index.html;
    server_tokens off;

    # Telegram Mini App: без X-Frame-Options, в frame-ancestors — домены Telegram (веб-клиенты в iframe).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(api|webhook)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # поправить под версию PHP на сервере
    }

    # Прочие .php в public нет — не исполнять ничего лишнего.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
